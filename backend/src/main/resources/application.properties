# Application configuration for the crypto alerts backend.
#
# The datasource can be set to BINANCE to fetch real market data from
# Binance's public REST API, or to MOCK to generate synthetic OHLCV
# candles. This property can be overridden via environment variables or
# command line arguments (e.g. --app.datasource=BINANCE).
app.datasource=MOCK

# Server port. Adjust if port 8080 is unavailable on your machine.
server.port=8080